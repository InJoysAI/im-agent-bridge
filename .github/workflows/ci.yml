name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  gateway:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: im_agent_bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d im_agent_bridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      GOOSE_DRIVER: postgres
      GOOSE_DBSTRING: postgres://postgres:postgres@localhost:5432/im_agent_bridge?sslmode=disable
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/im_agent_bridge?sslmode=disable
      DATABASE_URL_TEST: postgres://postgres:postgres@localhost:5432/im_agent_bridge?sslmode=disable
      GATEWAY_BEARER_TOKEN: ci-token
      BRIDGE_URL: http://127.0.0.1:4242

    steps:
      - uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Add GOPATH bin to PATH
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Apply migrations
        run: goose -dir SSoT/schema/migrations up

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Gateway tests
        working-directory: gateway
        run: cargo test --all-targets

      - name: Gateway DB reachable test
        working-directory: gateway
        run: cargo test health_check_returns_ok_when_pg_reachable -- --ignored
