services:
  nanobot:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8900:8900"
    volumes:
      - ./nanobot-data:/home/nanobot/.nanobot
      - ./config.json:/home/nanobot/.nanobot/config.json:ro
      - ./memory/MEMORY.md:/home/nanobot/.nanobot/workspace/memory/MEMORY.md:ro
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
